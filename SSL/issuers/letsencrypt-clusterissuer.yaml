# Let's Encrypt ClusterIssuer for Production
# Save as: letsencrypt-clusterissuer.yaml

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt production server
    server: https://acme-v02.api.letsencrypt.org/directory
    
    # Your email address (required for Let's Encrypt)
    email: ganesh@aagnyasoft.com # CHANGE THIS TO YOUR EMAIL
    
    # Private key secret for ACME account
    privateKeySecretRef:
      name: letsencrypt-prod
    
    # HTTP-01 challenge solver
    solvers:
    - http01:
        ingress:
          class: traefik  # Use Traefik for HTTP-01 challenge
    
    # DNS-01 challenge solver (optional, for wildcard certificates)
    # - dns01:
    #     cloudflare:  # Example for Cloudflare DNS
    #       email: your-email@example.com
    #       apiKeySecretRef:
    #         name: cloudflare-api-key-secret
    #         key: api-key

---
# Staging ClusterIssuer for testing (to avoid rate limits)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Let's Encrypt staging server (for testing)
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ganesh@aagnyasoft.com # CHANGE THIS TO YOUR EMAIL
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
    - http01:
        ingress:
          class: traefik